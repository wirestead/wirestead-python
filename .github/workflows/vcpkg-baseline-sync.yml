name: vcpkg baseline sync

# VCPKG_BASELINE pins the microsoft/vcpkg commit the vcpkg-consuming jobs
# build against. Rather than tracking vcpkg's default branch directly, this
# repository follows the core repository's baseline, the same way
# WIRESTEAD_CORE_REF follows core releases.
#
# That is deliberate. CI here never builds arm64-linux, but release.yml builds
# manylinux aarch64 wheels on exactly that triplet, so a baseline can pass
# review here and still fail at release time. The core repository's CI does
# build Linux ARM64, so letting it clear a commit first is the cheaper check.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync the vcpkg baseline from the core repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7

      - name: Resolve the core repository baseline
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(cat VCPKG_BASELINE)"
          candidate="$(gh api repos/wirestead/wirestead/contents/VCPKG_BASELINE --jq '.content' | base64 -d | tr -d '[:space:]')"

          if ! printf '%s' "${candidate}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "core baseline is not a full commit SHA: '${candidate}'"
            exit 1
          fi

          echo "current:   ${current}"
          echo "candidate: ${candidate}"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "candidate=${candidate}" >> "$GITHUB_OUTPUT"

          if [ "${current}" = "${candidate}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync pull request
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          # A PR opened with GITHUB_TOKEN does not trigger workflow runs, so
          # prefer a PAT when one is configured. Without it the PR still opens,
          # but CI has to be kicked by hand before the sync means anything.
          GH_TOKEN: ${{ secrets.VCPKG_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.candidate.outputs.current }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          HAS_PAT: ${{ secrets.VCPKG_BUMP_TOKEN != '' }}
        run: |
          set -euo pipefail
          branch="automation/vcpkg-baseline"
          short="${CANDIDATE:0:12}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${branch}"
          printf '%s\n' "${CANDIDATE}" > VCPKG_BASELINE
          git add VCPKG_BASELINE
          git commit -m "ci: sync the vcpkg baseline to ${short}"
          git push --force origin "${branch}"

          {
            printf 'Moves `VCPKG_BASELINE` from `%s` to [`%s`](https://github.com/microsoft/vcpkg/commit/%s), matching [wirestead/wirestead](https://github.com/wirestead/wirestead/blob/main/VCPKG_BASELINE).\n\n' \
              "${CURRENT}" "${short}" "${CANDIDATE}"
            printf 'Opened automatically because this repository pin had fallen behind the core repository.\n\n'
            printf 'CI here does not build arm64-linux, so a green run is not by itself proof this baseline is safe for the manylinux aarch64 release wheels. Confirm the core repository built against this commit.\n\n'
            if [ "${HAS_PAT}" != "true" ]; then
              printf 'This PR was opened with `GITHUB_TOKEN`, so GitHub will not start workflow runs for it. Close and reopen it, or push any commit, to trigger CI. Configure a `VCPKG_BUMP_TOKEN` secret to have that happen automatically.\n'
            fi
          } > vcpkg-sync-body.md

          existing="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --body-file vcpkg-sync-body.md
            echo "updated existing PR #${existing}"
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "ci: sync the vcpkg baseline to ${short}" \
              --body-file vcpkg-sync-body.md
          fi

      - name: Report no change
        if: steps.candidate.outputs.changed != 'true'
        run: echo "VCPKG_BASELINE already matches the core repository"
