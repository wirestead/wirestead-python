name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build for a manual release validation"
        required: true
        default: "main"
      tag_name:
        description: "Expected version tag and release name"
        required: true
      upload:
        description: "Upload release assets to GitHub"
        type: boolean
        required: false
        default: true
      publish_pypi:
        description: "Publish sdist/wheels to PyPI"
        type: boolean
        required: false
        default: false
      pypi_target:
        description: "PyPI index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        required: false
        default: testpypi

permissions:
  contents: write

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}

      - name: Match package version to release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' src/wirestead/_version.py)
          test -n "$PACKAGE_VERSION"
          test "${RELEASE_TAG#v}" = "$PACKAGE_VERSION"
          echo "release version: $PACKAGE_VERSION"

  source-distribution:
    name: Source distribution
    runs-on: ubuntu-24.04
    needs: validate-release-version

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: |
          python -m pip install -U pip
          python -m pip install build scikit-build-core "pybind11>=2.13,<3"
          python -m build --sdist --no-isolation

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheel (${{ matrix.os_label }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: validate-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            os_label: macos-15-arm64
            python-version: "3.10"
          - os: macos-15
            os_label: macos-15-arm64
            python-version: "3.11"
          - os: macos-15
            os_label: macos-15-arm64
            python-version: "3.12"
          - os: macos-15
            os_label: macos-15-arm64
            python-version: "3.13"
          - os: windows-2022
            os_label: windows-amd64
            python-version: "3.10"
          - os: windows-2022
            os_label: windows-amd64
            python-version: "3.11"
          - os: windows-2022
            os_label: windows-amd64
            python-version: "3.12"
          - os: windows-2022
            os_label: windows-amd64
            python-version: "3.13"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}

      - name: Read Wirestead core ref
        id: core-ref
        shell: bash
        run: echo "ref=$(cat WIRESTEAD_CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wirestead core
        uses: actions/checkout@v7
        with:
          repository: wirestead/wirestead
          ref: ${{ steps.core-ref.outputs.ref }}
          path: wirestead-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build deps
        run: |
          python -m pip install -U pip
          python -m pip install "pytest>=8,<10" pytest-asyncio scikit-build-core "pybind11>=2.13,<3"

      - name: Install system deps on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Checkout vcpkg
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Cache vcpkg packages
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            vcpkg/buildtrees
            vcpkg/downloads
            vcpkg/installed
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-release-${{ hashFiles('.github/workflows/release.yml', 'vcpkg/builtin-baseline', 'vcpkg/ports/boost-asio/**', 'vcpkg/ports/boost-system/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-release-
            ${{ runner.os }}-vcpkg-

      - name: Install vcpkg deps on macOS
        if: runner.os == 'macOS'
        run: |
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install --classic boost-asio boost-system --triplet arm64-osx

      - name: Install vcpkg deps on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./vcpkg/bootstrap-vcpkg.bat
          ./vcpkg/vcpkg install --classic boost-asio boost-system --triplet x64-windows-static-md

      - name: Build wheel on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip wheel . --no-build-isolation -w dist \
            --config-settings=cmake.define.WIRESTEAD_CORE_SOURCE_DIR=${{ github.workspace }}/wirestead-core \
            --config-settings=cmake.define.VCPKG_MANIFEST_MODE=OFF \
            --config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            --config-settings=cmake.define.VCPKG_TARGET_TRIPLET=arm64-osx

      - name: Build wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip wheel . --no-build-isolation -w dist `
            "--config-settings=cmake.define.WIRESTEAD_CORE_SOURCE_DIR=${{ github.workspace }}/wirestead-core" `
            "--config-settings=cmake.define.VCPKG_MANIFEST_MODE=OFF" `
            "--config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "--config-settings=cmake.define.VCPKG_TARGET_TRIPLET=x64-windows-static-md"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-wheel-${{ matrix.os_label }}-py${{ matrix.python-version }}
          path: dist/*.whl

  wheels-linux:
    name: Wheel (manylinux_2_28, ${{ matrix.arch_label }})
    runs-on: ${{ matrix.runner }}
    needs: validate-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch_label: x86_64
            cibw_archs: x86_64
            vcpkg_triplet: x64-linux
          - runner: ubuntu-24.04-arm
            arch_label: aarch64
            cibw_archs: aarch64
            vcpkg_triplet: arm64-linux

    env:
      CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs }}
      CIBW_BUILD: "cp310-manylinux_${{ matrix.cibw_archs }} cp311-manylinux_${{ matrix.cibw_archs }} cp312-manylinux_${{ matrix.cibw_archs }} cp313-manylinux_${{ matrix.cibw_archs }}"
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_ENVIRONMENT_LINUX: >-
        SKBUILD_CMAKE_DEFINE="WIRESTEAD_CORE_SOURCE_DIR=/host${{ github.workspace }}/wirestead-core;VCPKG_MANIFEST_MODE=OFF;CMAKE_TOOLCHAIN_FILE=/vcpkg/scripts/buildsystems/vcpkg.cmake;VCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}"
      CIBW_BEFORE_ALL_LINUX: >-
        dnf install -y ninja-build zip unzip perl-IPC-Cmd &&
        git clone --depth 1 https://github.com/microsoft/vcpkg.git /vcpkg &&
        /vcpkg/bootstrap-vcpkg.sh &&
        /vcpkg/vcpkg install --classic boost-asio boost-system --triplet ${{ matrix.vcpkg_triplet }}
      CIBW_TEST_REQUIRES: "pytest>=8,<10 pytest-asyncio"
      CIBW_TEST_COMMAND: >-
        python -c "import wirestead; print(wirestead.__version__)" &&
        cd /tmp && python {project}/scripts/consumer_smoke.py --project-root {project} &&
        cd {project} && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -p pytest_asyncio.plugin -m "not serial and not integration"

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}

      - name: Read Wirestead core ref
        id: core-ref
        shell: bash
        run: echo "ref=$(cat WIRESTEAD_CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wirestead core
        uses: actions/checkout@v7
        with:
          repository: wirestead/wirestead
          ref: ${{ steps.core-ref.outputs.ref }}
          path: wirestead-core

      - name: Build manylinux wheels
        uses: pypa/cibuildwheel@v3.4

      - name: Inspect manylinux wheel dependencies
        run: |
          python -m pip install auditwheel
          for wheel in wheelhouse/*.whl; do
            echo "Inspecting ${wheel}"
            auditwheel show "${wheel}"
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-wheel-manylinux_2_28-${{ matrix.arch_label }}
          path: wheelhouse/*.whl

  wheel-consumer-smoke:
    name: Consumer smoke (${{ matrix.os_label }}, py${{ matrix.python-version }})
    needs: [wheels, wheels-linux]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os_label: manylinux_2_28-x86_64
            artifact: release-wheel-manylinux_2_28-x86_64
            python-version: "3.10"
          - os: ubuntu-24.04
            os_label: manylinux_2_28-x86_64
            artifact: release-wheel-manylinux_2_28-x86_64
            python-version: "3.11"
          - os: ubuntu-24.04
            os_label: manylinux_2_28-x86_64
            artifact: release-wheel-manylinux_2_28-x86_64
            python-version: "3.12"
          - os: ubuntu-24.04
            os_label: manylinux_2_28-x86_64
            artifact: release-wheel-manylinux_2_28-x86_64
            python-version: "3.13"
          - os: ubuntu-24.04-arm
            os_label: manylinux_2_28-aarch64
            artifact: release-wheel-manylinux_2_28-aarch64
            python-version: "3.10"
          - os: ubuntu-24.04-arm
            os_label: manylinux_2_28-aarch64
            artifact: release-wheel-manylinux_2_28-aarch64
            python-version: "3.11"
          - os: ubuntu-24.04-arm
            os_label: manylinux_2_28-aarch64
            artifact: release-wheel-manylinux_2_28-aarch64
            python-version: "3.12"
          - os: ubuntu-24.04-arm
            os_label: manylinux_2_28-aarch64
            artifact: release-wheel-manylinux_2_28-aarch64
            python-version: "3.13"
          - os: macos-15
            os_label: macos-15-arm64
            artifact: release-wheel-macos-15-arm64-py3.10
            python-version: "3.10"
          - os: macos-15
            os_label: macos-15-arm64
            artifact: release-wheel-macos-15-arm64-py3.11
            python-version: "3.11"
          - os: macos-15
            os_label: macos-15-arm64
            artifact: release-wheel-macos-15-arm64-py3.12
            python-version: "3.12"
          - os: macos-15
            os_label: macos-15-arm64
            artifact: release-wheel-macos-15-arm64-py3.13
            python-version: "3.13"
          - os: windows-2022
            os_label: windows-amd64
            artifact: release-wheel-windows-amd64-py3.10
            python-version: "3.10"
          - os: windows-2022
            os_label: windows-amd64
            artifact: release-wheel-windows-amd64-py3.11
            python-version: "3.11"
          - os: windows-2022
            os_label: windows-amd64
            artifact: release-wheel-windows-amd64-py3.12
            python-version: "3.12"
          - os: windows-2022
            os_label: windows-amd64
            artifact: release-wheel-windows-amd64-py3.13
            python-version: "3.13"

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: wheel-artifacts

      - name: Install wheel in a clean venv and run loopback smoke tests
        shell: bash
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python scripts/run_wheel_consumer_smoke.py \
            --wheel-dir wheel-artifacts \
            --project-root "$PROJECT_ROOT"

  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-24.04
    needs: [source-distribution, wheels, wheels-linux, wheel-consumer-smoke]
    if: github.event_name == 'push' || inputs.upload == true || inputs.upload == 'true'

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          cat > release-notes.md <<EOF
          ## Wirestead Python ${RELEASE_TAG}

          Release aligned with the matching Wirestead C++ core release line.

          See \`CHANGELOG.md\` for details.
          EOF

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [source-distribution, wheels, wheels-linux, wheel-consumer-smoke]
    if: github.event_name == 'workflow_dispatch' && (inputs.publish_pypi == true || inputs.publish_pypi == 'true')
    environment:
      name: ${{ inputs.pypi_target == 'pypi' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: |
          find dist -maxdepth 1 -type f \( -name "*.whl" -o -name "*.tar.gz" \) -print | sort

      - name: Publish to TestPyPI
        if: inputs.pypi_target != 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

      - name: Publish to PyPI
        if: inputs.pypi_target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
