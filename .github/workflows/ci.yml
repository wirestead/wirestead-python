name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7

      - name: Read Wirestead core ref
        id: core-ref
        shell: bash
        run: echo "ref=$(cat WIRESTEAD_CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wirestead core
        uses: actions/checkout@v7
        with:
          repository: wirestead/wirestead
          ref: ${{ steps.core-ref.outputs.ref }}
          path: wirestead-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build deps
        run: |
          python -m pip install -U pip
          python -m pip install "pytest>=8,<10" pytest-asyncio build scikit-build-core "pybind11>=2.13,<3"

      - name: Install system deps on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libboost-system-dev libboost-thread-dev libspdlog-dev

      - name: Install system deps on macOS
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: echo "sha=$(cat VCPKG_BASELINE)" >> "$GITHUB_OUTPUT"

      - name: Checkout vcpkg
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg-baseline.outputs.sha }}
          path: vcpkg

      - name: Cache vcpkg packages
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            vcpkg/buildtrees
            vcpkg/downloads
            vcpkg/installed
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/ci.yml', 'VCPKG_BASELINE', 'vcpkg/builtin-baseline', 'vcpkg/ports/boost-asio/**', 'vcpkg/ports/boost-system/**') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install vcpkg deps on macOS
        if: runner.os == 'macOS'
        run: |
          ./vcpkg/bootstrap-vcpkg.sh
          ./vcpkg/vcpkg install --classic boost-asio boost-system --triplet arm64-osx

      - name: Install vcpkg deps on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./vcpkg/bootstrap-vcpkg.bat
          ./vcpkg/vcpkg install --classic boost-asio boost-system --triplet x64-windows-static-md

      - name: Build and install package on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install . \
            --config-settings=cmake.define.WIRESTEAD_CORE_SOURCE_DIR=${{ github.workspace }}/wirestead-core

      - name: Build and install package on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install . \
            --config-settings=cmake.define.WIRESTEAD_CORE_SOURCE_DIR=${{ github.workspace }}/wirestead-core \
            --config-settings=cmake.define.VCPKG_MANIFEST_MODE=OFF \
            --config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            --config-settings=cmake.define.VCPKG_TARGET_TRIPLET=arm64-osx

      - name: Build and install package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install . `
            "--config-settings=cmake.define.WIRESTEAD_CORE_SOURCE_DIR=${{ github.workspace }}/wirestead-core" `
            "--config-settings=cmake.define.VCPKG_MANIFEST_MODE=OFF" `
            "--config-settings=cmake.define.CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "--config-settings=cmake.define.VCPKG_TARGET_TRIPLET=x64-windows-static-md"

      - name: Import smoke
        if: runner.os != 'Windows'
        run: |
          python -c "import wirestead; print(wirestead.__version__)"

      - name: Check type stubs are up to date
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python -m pip install pybind11-stubgen==2.5.5
          ./scripts/generate_stubs.sh
          git diff --exit-code -- src/wirestead/_core.pyi

      - name: Import smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $site = python -c "import site; print(site.getsitepackages()[0])"
          $vcpkgBin = "${{ github.workspace }}/vcpkg/installed/x64-windows-static-md/bin"
          $vcRuntime = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\msvcp140.dll" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vcRuntime) { throw "MSVC x64 runtime not found" }
          $vcRuntimeBin = $vcRuntime.DirectoryName
          Write-Host "Using VC runtime path: $vcRuntimeBin"
          $env:WIRESTEAD_WINDOWS_DLL_DIRS = "$vcRuntimeBin;$vcpkgBin"
          $env:PATH = "$vcRuntimeBin;$site;$site\wirestead;$vcpkgBin;$env:PATH"
          $env:WIRESTEAD_INSTALL_PATH = $site
          $env:WIRESTEAD_PACKAGE_PATH = $site

          python -X faulthandler -c "import wirestead; print(wirestead.__version__)"
          if ($LASTEXITCODE -ne 0) {
            python bindings/python/diagnose_windows_import.py
            exit 1
          }

      # Every other CI step installs test tooling unpinned, so nothing here
      # exercises the `test` extra as a consumer would. That is how a
      # `pytest-asyncio` floor with no distribution for a supported interpreter
      # shipped once already. Resolve the installed package's own metadata for
      # the running interpreter so a regression fails CI instead of reaching
      # PyPI.
      - name: Validate test extra resolves
        if: runner.os == 'Linux'
        run: |
          python - <<'PY' > test-extra-requirements.txt
          import importlib.metadata as md
          from packaging.requirements import Requirement

          for spec in md.requires("wirestead") or []:
              req = Requirement(spec)
              if req.marker and req.marker.evaluate({"extra": "test"}):
                  print(f"{req.name}{req.specifier}")
          PY
          echo "test extra for $(python -V 2>&1):"
          cat test-extra-requirements.txt
          test -s test-extra-requirements.txt
          python -m pip install --dry-run --ignore-installed -r test-extra-requirements.txt

      - name: Run tests
        if: runner.os != 'Windows'
        env:
          WIRESTEAD_PYTHON_RUN_LOOPBACK_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q -p pytest_asyncio.plugin -m "not serial"

      - name: Run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIRESTEAD_PYTHON_RUN_LOOPBACK_TESTS: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          $site = python -c "import site; print(site.getsitepackages()[0])"
          $vcpkgBin = "${{ github.workspace }}/vcpkg/installed/x64-windows-static-md/bin"
          $vcRuntime = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\msvcp140.dll" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vcRuntime) { throw "MSVC x64 runtime not found" }
          $vcRuntimeBin = $vcRuntime.DirectoryName
          Write-Host "Using VC runtime path: $vcRuntimeBin"
          $env:WIRESTEAD_WINDOWS_DLL_DIRS = "$vcRuntimeBin;$vcpkgBin"
          $env:PATH = "$vcRuntimeBin;$site;$site\wirestead;$vcpkgBin;$env:PATH"
          $env:WIRESTEAD_INSTALL_PATH = $site
          $env:WIRESTEAD_PACKAGE_PATH = $site

          python -X faulthandler -m pytest -q -p pytest_asyncio.plugin -m "not serial"

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7

      - name: Read Wirestead core ref
        id: core-ref
        shell: bash
        run: echo "ref=$(cat WIRESTEAD_CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wirestead core
        uses: actions/checkout@v7
        with:
          repository: wirestead/wirestead
          ref: ${{ steps.core-ref.outputs.ref }}
          path: wirestead-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libboost-system-dev libboost-thread-dev libspdlog-dev

      - name: Build source distribution
        run: |
          python -m pip install -U pip
          python -m pip install build scikit-build-core "pybind11>=2.13,<3"
          python -m build --sdist --no-isolation

      # The sdist is published to PyPI and is what pip falls back to on any
      # platform without a wheel, but nothing else in CI installs it, so a file
      # missing from the sdist would only surface for users. Build it, then
      # install it as a consumer would with a core supplied.
      - name: Install from sdist against core source
        run: |
          python -m pip install dist/*.tar.gz --no-build-isolation \
            --config-settings=cmake.define.WIRESTEAD_CORE_SOURCE_DIR=${{ github.workspace }}/wirestead-core

      - name: Import smoke
        run: |
          cd "$(mktemp -d)"
          python -c "import wirestead; print(wirestead.__version__)"

      # A source build with no core is a supported outcome, but it must explain
      # itself instead of surfacing a bare find_package failure.
      - name: Source build without a core reports actionable guidance
        run: |
          python -m pip uninstall -y wirestead
          if python -m pip install dist/*.tar.gz --no-build-isolation \
              --no-cache-dir > sdist-nocore.log 2>&1; then
            echo "expected the coreless source build to fail, but it succeeded"
            exit 1
          fi
          grep -q "No Wirestead C++ core was found" sdist-nocore.log
          grep -q "WIRESTEAD_CORE_SOURCE_DIR" sdist-nocore.log
          echo "coreless source build failed with guidance, as intended"

  vcpkg-core:
    name: vcpkg core
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: echo "sha=$(cat VCPKG_BASELINE)" >> "$GITHUB_OUTPUT"

      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.vcpkg-baseline.outputs.sha }}
          path: vcpkg

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Verify vcpkg package install
        run: scripts/verify.sh --skip-source

  installed-core:
    name: Installed core
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      WIRESTEAD_INSTALL_PREFIX: /tmp/wirestead-prefix

    steps:
      - name: Checkout Wirestead Python
        uses: actions/checkout@v7

      - name: Read Wirestead core ref
        id: core-ref
        shell: bash
        run: echo "ref=$(cat WIRESTEAD_CORE_REF)" >> "$GITHUB_OUTPUT"

      - name: Checkout Wirestead core
        uses: actions/checkout@v7
        with:
          repository: wirestead/wirestead
          ref: ${{ steps.core-ref.outputs.ref }}
          path: wirestead-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libboost-system-dev libboost-thread-dev libspdlog-dev

      - name: Configure Wirestead core
        run: >
          cmake -S wirestead-core -B build-wirestead-install
          -DCMAKE_INSTALL_PREFIX=$WIRESTEAD_INSTALL_PREFIX
          -DWIRESTEAD_BUILD_TESTS=OFF
          -DWIRESTEAD_BUILD_DOCS=OFF

      - name: Build Wirestead core
        run: cmake --build build-wirestead-install --parallel

      - name: Install Wirestead core
        run: cmake --install build-wirestead-install

      - name: Verify installed package install
        run: scripts/verify.sh --skip-source --skip-vcpkg --installed-prefix $WIRESTEAD_INSTALL_PREFIX
