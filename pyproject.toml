[build-system]
requires = [
  "scikit-build-core>=0.8",
  "pybind11>=2.13,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "wirestead"
dynamic = ["version"]
description = "Async serial, TCP, UDP and Unix socket communication for Python, backed by a C++20 core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Jinwoo Sung" },
]
keywords = [
  "serial",
  "serial-port",
  "rs485",
  "tcp",
  "udp",
  "unix-socket",
  "socket",
  "async",
  "asyncio",
  "communication",
  "networking",
  "cross-platform",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Framework :: AsyncIO",
  "Topic :: Communications",
  "Topic :: System :: Networking",
  "Topic :: Terminals :: Serial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C++",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=1.4.0",
]

[project.urls]
Documentation = "https://github.com/wirestead/wirestead-python#readme"
Source = "https://github.com/wirestead/wirestead-python"
Changelog = "https://github.com/wirestead/wirestead-python/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/wirestead/wirestead-python/issues"
"Wirestead Core" = "https://github.com/wirestead/wirestead"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/wirestead"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/wirestead/_version.py"

[tool.scikit-build.cmake]
version = ">=3.21"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests requiring local sockets or runtime loopback",
  "serial: tests requiring serial devices",
]
